        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .card-hover {
            transition: all 0.3s ease;
        }
        .card-hover:hover {
            transform: translateY(-3px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.12);
        }

        .masonry {
            column-count: 4;
            column-gap: 12px;
        }
        @media (max-width: 1280px) { .masonry { column-count: 3; } }
        @media (max-width: 900px)  { .masonry { column-count: 2; } }
        @media (max-width: 500px)  { .masonry { column-count: 1; } }

        .gallery-item {
            break-inside: avoid;
            margin-bottom: 12px;
        }

        .lightbox-bg {
            background: rgba(0,0,0,0.93);
            backdrop-filter: blur(6px);
        }
    </style>
</head>

    ],

    async init() {
        if (typeof api !== 'undefined' && api.getProfile) {
            const res = await api.getProfile().catch(() => null);
            if (res && res.success) this.userProfile = res.data;
        }
    },

    get filtered() {
        if (this.filter === 'fotos') return this.items.filter(i => i.type === 'img');
        if (this.filter === 'videos') return this.items.filter(i => i.type === 'video');
        return this.items;
    },

    open(item, idx) {
        this.current = item;
        this.currentIndex = idx;
        this.lightbox = true;
        document.body.style.overflow = 'hidden';
    },
    close() {
        this.lightbox = false;
        this.current = null;
        document.body.style.overflow = '';
        document.querySelectorAll('.lb-video').forEach(v => v.pause());
    },
    prev() {
        const list = this.filtered;
        this.currentIndex = (this.currentIndex - 1 + list.length) % list.length;
        this.current = list[this.currentIndex];
        document.querySelectorAll('.lb-video').forEach(v => v.pause());
    },
    next() {
        const list = this.filtered;
        this.currentIndex = (this.currentIndex + 1) % list.length;
        this.current = list[this.currentIndex];
        document.querySelectorAll('.lb-video').forEach(v => v.pause());
    }
}" @keydown.escape.window="if(lightbox) close()"
   @keydown.arrow-left.window="if(lightbox) prev()"
   @keydown.arrow-right.window="if(lightbox) next()">

    <!-- Mobile Overlay -->
    <div x-show="sidebarOpen"
         @click="sidebarOpen = false"
         x-transition:enter="transition-opacity ease-linear duration-300"
         x-transition:enter-start="opacity-0"
         x-transition:enter-end="opacity-100"
         x-transition:leave="transition-opacity ease-linear duration-300"
         x-transition:leave-start="opacity-100"
         x-transition:leave-end="opacity-0"
         class="fixed inset-0 bg-black bg-opacity-50 z-40 lg:hidden"></div>

    <!-- Sidebar -->
    <aside :class="sidebarOpen ? 'translate-x-0' : '-translate-x-full lg:translate-x-0'"
           class="fixed left-0 top-0 h-full bg-white shadow-xl transition-all duration-300 z-50 w-64 lg:w-64">
        <div class="flex flex-col h-full">

            <!-- Logo -->
            <div class="p-4 lg:p-6 gradient-bg">
                <div class="flex items-center justify-between">
                    <div class="text-white">
                        <h1 class="text-lg lg:text-xl font-bold">SuperVision</h1>
                        <p class="text-xs text-purple-200">Sistema de Monitoreo</p>
                    </div>
                    <button @click="sidebarOpen = false" class="text-white hover:bg-white/20 p-2 rounded-lg lg:hidden">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
            </div>

            <!-- Navigation -->
            <nav class="flex-1 p-2 lg:p-4 space-y-1 lg:space-y-2 overflow-y-auto">
                <a href="index.html" class="flex items-center space-x-3 p-2 lg:p-3 rounded-xl hover:bg-gray-100 text-gray-700 transition-colors">
                    <i class="fas fa-chart-line w-5 lg:w-6"></i>
                    <span class="font-medium text-sm lg:text-base">Dashboard</span>
                </a>

                <a href="registro-evidencias.html" class="flex items-center space-x-3 p-2 lg:p-3 rounded-xl hover:bg-gray-100 text-gray-700 transition-colors">
                    <i class="fas fa-camera w-5 lg:w-6"></i>
                    <span class="font-medium text-sm lg:text-base">Registro de Evidencias</span>
                    <span class="ml-auto bg-red-500 text-white text-xs rounded-full px-2 py-1">3</span>
                </a>

                <a href="listados.html" class="flex items-center space-x-3 p-2 lg:p-3 rounded-xl hover:bg-gray-100 text-gray-700 transition-colors">
                    <i class="fas fa-list-alt w-5 lg:w-6"></i>
                    <span class="font-medium text-sm lg:text-base">Listados y Registros</span>
                </a>

                <a href="supervision-tiempo-real.html" class="flex items-center space-x-3 p-2 lg:p-3 rounded-xl hover:bg-gray-100 text-gray-700 transition-colors">
                    <i class="fas fa-eye w-5 lg:w-6"></i>
                    <span class="font-medium text-sm lg:text-base">Supervisión en Vivo</span>
                </a>

                <a href="eventos-capacitacion.html" class="flex items-center space-x-3 p-2 lg:p-3 rounded-xl hover:bg-gray-100 text-gray-700 transition-colors">
                    <i class="fas fa-calendar-check w-5 lg:w-6"></i>
                    <span class="font-medium text-sm lg:text-base">Eventos y Capacitación</span>
                </a>

                <a href="galeria.html" class="flex items-center space-x-3 p-2 lg:p-3 rounded-xl bg-gradient-to-r from-purple-500 to-purple-600 text-white">
                    <i class="fas fa-images w-5 lg:w-6"></i>
                    <span class="font-medium text-sm lg:text-base">Galería</span>
                </a>

                <hr class="my-2 lg:my-4">

                <a href="configuracion.html" class="flex items-center space-x-3 p-2 lg:p-3 rounded-xl hover:bg-gray-100 text-gray-700 transition-colors">
                    <i class="fas fa-cog w-5 lg:w-6"></i>
                    <span class="font-medium text-sm lg:text-base">Configuración</span>
                </a>

                <a href="ayuda.html" class="flex items-center space-x-3 p-2 lg:p-3 rounded-xl hover:bg-gray-100 text-gray-700 transition-colors">
                    <i class="fas fa-question-circle w-5 lg:w-6"></i>
                    <span class="font-medium text-sm lg:text-base">Ayuda</span>
                </a>
            </nav>

            <!-- User Profile -->
            <div class="p-3 lg:p-4 border-t">
                <div class="flex items-center space-x-2 lg:space-x-3 mb-3">
                    <img :src="userProfile ? `https://ui-avatars.com/api/?name=${encodeURIComponent(userProfile.full_name || 'User')}&background=667eea&color=fff` : 'https://ui-avatars.com/api/?name=User&background=667eea&color=fff'"
                         class="w-8 h-8 lg:w-10 lg:h-10 rounded-full flex-shrink-0" alt="User">
                    <div class="min-w-0 flex-1">
                        <p class="text-xs lg:text-sm font-semibold text-gray-700 truncate" x-text="userProfile ? userProfile.full_name : 'Usuario'"></p>
                        <p class="text-[10px] lg:text-xs text-gray-500 truncate" x-text="userProfile ? (userProfile.role || 'Usuario').charAt(0).toUpperCase() + (userProfile.role || 'Usuario').slice(1) : 'Usuario'"></p>

                </div>
                <button @click="typeof api !== 'undefined' && api.logout && api.logout()"

                </button>

    <!-- Main Content -->
    <div class="lg:ml-64 transition-all duration-300">

        <!-- Top Bar -->
        <header class="bg-white shadow-sm sticky top-0 z-40">
            <div class="flex items-center justify-between p-4 lg:p-6">
                <div class="flex items-center gap-3">
                    <button @click="sidebarOpen = true" class="lg:hidden text-gray-600 hover:bg-gray-100 p-2 rounded-lg">
                        <i class="fas fa-bars text-xl"></i>
                    </button>
                    <div>
                        <h2 class="text-lg lg:text-2xl font-bold text-gray-800">Galería de Evidencias</h2>
                        <p class="text-gray-500 text-xs lg:text-sm hidden sm:block">Alto y Bajo Baudó · 11 de mayo de 2026</p>
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    <span class="hidden sm:flex items-center gap-1.5 bg-gray-100 px-3 py-1.5 rounded-full text-sm text-gray-600">
                        <i class="fas fa-image text-purple-500 text-xs"></i>
                        <span x-text="items.filter(i=>i.type==='img').length + ' fotos'"></span>
                    </span>
                    <span class="hidden sm:flex items-center gap-1.5 bg-gray-100 px-3 py-1.5 rounded-full text-sm text-gray-600">
                        <i class="fas fa-video text-purple-500 text-xs"></i>
                        <span x-text="items.filter(i=>i.type==='video').length + ' videos'"></span>
                    </span>
                </div>
            </div>
        </header>

        <!-- Page Content -->
        <main class="p-4 lg:p-6">

            <!-- Filtros -->
            <div class="flex items-center gap-2 mb-6">
                <button @click="filter='all'"
                        :class="filter==='all' ? 'bg-gradient-to-r from-purple-500 to-purple-600 text-white shadow-md' : 'bg-white text-gray-600 hover:bg-gray-50 border border-gray-200'"
                        class="px-4 py-2 rounded-xl text-sm font-medium transition-all">
                    <i class="fas fa-th-large mr-1.5"></i>Todos
                    <span class="ml-1 opacity-70" x-text="'('+items.length+')'"></span>
                </button>
                <button @click="filter='fotos'"
                        :class="filter==='fotos' ? 'bg-gradient-to-r from-purple-500 to-purple-600 text-white shadow-md' : 'bg-white text-gray-600 hover:bg-gray-50 border border-gray-200'"
                        class="px-4 py-2 rounded-xl text-sm font-medium transition-all">
                    <i class="fas fa-image mr-1.5"></i>Fotos
                    <span class="ml-1 opacity-70" x-text="'('+items.filter(i=>i.type===\'img\').length+')'"></span>
                </button>
                <button @click="filter='videos'"
                        :class="filter==='videos' ? 'bg-gradient-to-r from-purple-500 to-purple-600 text-white shadow-md' : 'bg-white text-gray-600 hover:bg-gray-50 border border-gray-200'"
                        class="px-4 py-2 rounded-xl text-sm font-medium transition-all">
                    <i class="fas fa-video mr-1.5"></i>Videos
                    <span class="ml-1 opacity-70" x-text="'('+items.filter(i=>i.type===\'video\').length+')'"></span>
                </button>
            </div>

            <!-- Videos -->
            <template x-if="filter === 'all' || filter === 'videos'">
                <div class="mb-8">
                    <h3 class="text-sm font-semibold text-gray-500 uppercase tracking-wider mb-3">
                        <i class="fas fa-video mr-2 text-purple-500"></i>Videos
                    </h3>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <template x-for="(item, idx) in items.filter(i => i.type === 'video')" :key="item.src">
                            <div class="bg-black rounded-2xl overflow-hidden shadow-lg cursor-pointer group relative card-hover"
                                 @click="open(item, filtered.indexOf(item))">
                                <video class="w-full max-h-56 object-cover opacity-80" preload="metadata">
                                    <source :src="item.src" type="video/mp4">
                                </video>
                                <div class="absolute inset-0 flex items-center justify-center">
                                    <div class="w-14 h-14 bg-white/90 rounded-full flex items-center justify-center shadow-xl group-hover:scale-110 transition-transform duration-200">
                                        <i class="fas fa-play text-purple-600 text-lg ml-1"></i>
                                    </div>
                                </div>
                                <div class="absolute bottom-0 left-0 right-0 p-3 bg-gradient-to-t from-black/70 to-transparent">
                                    <p class="text-white text-sm font-medium" x-text="item.label || 'Video'"></p>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>
            </template>

            <!-- Fotos masonry -->
            <template x-if="filter === 'all' || filter === 'fotos'">
                <div>
                    <h3 class="text-sm font-semibold text-gray-500 uppercase tracking-wider mb-3">
                        <i class="fas fa-image mr-2 text-purple-500"></i>Fotografías
                    </h3>
                    <div class="masonry">
                        <template x-for="(item, idx) in filtered.filter(i => i.type === 'img')" :key="item.src">
                            <div class="gallery-item rounded-xl overflow-hidden shadow-md cursor-pointer group relative card-hover"
                                 @click="open(item, filtered.indexOf(item))">
                                <img :src="item.src" loading="lazy"
                                     class="w-full block group-hover:scale-105 transition-transform duration-300"
                                     alt="">
                                <div class="absolute inset-0 bg-black/0 group-hover:bg-black/20 transition-all flex items-center justify-center">
                                    <i class="fas fa-expand text-white text-xl opacity-0 group-hover:opacity-100 transition-opacity drop-shadow-lg"></i>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>
            </template>

        </main>
    </div>

    <!-- Lightbox -->
    <div x-show="lightbox"
         x-transition:enter="transition-opacity duration-200"
         x-transition:enter-start="opacity-0"
         x-transition:enter-end="opacity-100"
         x-transition:leave="transition-opacity duration-150"
         x-transition:leave-start="opacity-100"
         x-transition:leave-end="opacity-0"
         class="fixed inset-0 z-[60] lightbox-bg flex items-center justify-center"
         @click.self="close()">

        <button @click="close()"
                class="absolute top-4 right-4 text-white/70 hover:text-white w-10 h-10 flex items-center justify-center rounded-full hover:bg-white/10 transition-all text-xl">
            <i class="fas fa-times"></i>
        </button>

        <button @click="prev()"
                class="absolute left-3 top-1/2 -translate-y-1/2 text-white/70 hover:text-white w-11 h-11 flex items-center justify-center rounded-full hover:bg-white/10 transition-all text-xl">
            <i class="fas fa-chevron-left"></i>
        </button>

        <button @click="next()"
                class="absolute right-3 top-1/2 -translate-y-1/2 text-white/70 hover:text-white w-11 h-11 flex items-center justify-center rounded-full hover:bg-white/10 transition-all text-xl">
            <i class="fas fa-chevron-right"></i>
        </button>

        <div class="max-w-5xl w-full px-16 py-10 flex items-center justify-center">
            <template x-if="current && current.type === 'img'">
                <img :src="current.src" class="max-w-full max-h-[82vh] object-contain rounded-2xl shadow-2xl" alt="">
            </template>
            <template x-if="current && current.type === 'video'">
                <video class="lb-video max-w-full max-h-[82vh] rounded-2xl shadow-2xl" controls autoplay>
                    <source :src="current.src" type="video/mp4">
                </video>
            </template>
        </div>

        <div class="absolute bottom-4 left-1/2 -translate-x-1/2 text-white/50 text-sm">
            <span x-text="currentIndex + 1"></span> / <span x-text="filtered.length"></span>
        </div>
    </div>

</body>
</html>
